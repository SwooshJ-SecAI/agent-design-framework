<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b6472"/>
    </marker>
    <style>
      .q  { fill:#1f2937; stroke:#94a3b8; stroke-width:1.5; rx:8; }
      .qt { fill:#f8fafc; font-size:14px; font-weight:600; }
      .lbl{ fill:#64748b; font-size:12px; font-style:italic; }
      .edge { stroke:#5b6472; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
      .vibe  { fill:#0e7490; stroke:#155e75; }
      .svibe { fill:#0891b2; stroke:#0e7490; }
      .slite { fill:#7c3aed; stroke:#6d28d9; }
      .sfull { fill:#b91c1c; stroke:#991b1b; }
      .tier-t{ fill:#ffffff; font-size:13px; font-weight:700; }
      .tier-s{ fill:#e2e8f0; font-size:10.5px; }
      .title { fill:#0f172a; font-size:20px; font-weight:700; }
      .sub   { fill:#64748b; font-size:12.5px; }
    </style>
  </defs>

  <text x="30" y="38" class="title">Agent Tiering Framework — Decision Tree</text>
  <text x="30" y="58" class="sub">Choose the build approach from the concept, driven by failure mode.</text>

  <!-- Q1 -->
  <rect class="q" x="360" y="80" width="240" height="46"/>
  <text class="qt" x="480" y="108" text-anchor="middle">Multi-step workflow?</text>

  <!-- Q1 NO branch to Q2 -->
  <path class="edge" d="M360,103 L200,103 L200,150"/>
  <text class="lbl" x="250" y="97">No</text>
  <!-- Q1 YES branch to Q3 -->
  <path class="edge" d="M600,103 L760,103 L760,150"/>
  <text class="lbl" x="690" y="97">Yes</text>

  <!-- Q2 -->
  <rect class="q" x="80" y="150" width="240" height="46"/>
  <text class="qt" x="200" y="171" text-anchor="middle">Multiple SOPs /</text>
  <text class="qt" x="200" y="188" text-anchor="middle">reference docs?</text>

  <!-- Q2 NO -> Vibe Basic -->
  <path class="edge" d="M120,196 L120,250"/>
  <text class="lbl" x="128" y="228">No</text>
  <!-- Q2 YES -> Structured Vibe -->
  <path class="edge" d="M280,196 L280,250"/>
  <text class="lbl" x="288" y="228">Yes</text>

  <!-- Q3 -->
  <rect class="q" x="640" y="150" width="240" height="46"/>
  <text class="qt" x="760" y="171" text-anchor="middle">Material drift</text>
  <text class="qt" x="760" y="188" text-anchor="middle">consequences?</text>

  <!-- Q3 NO -> Spec-Lite (left) -->
  <path class="edge" d="M640,173 L560,173 L560,250"/>
  <text class="lbl" x="590" y="167">No</text>
  <!-- Q3 YES -> Q4 -->
  <path class="edge" d="M760,196 L760,250"/>
  <text class="lbl" x="768" y="228">Yes</text>

  <!-- Q4 -->
  <rect class="q" x="640" y="250" width="240" height="52"/>
  <text class="qt" x="760" y="271" text-anchor="middle">Compliance or</text>
  <text class="qt" x="760" y="288" text-anchor="middle">multiple stakeholders?</text>

  <!-- Q4 NO -> Spec-Lite -->
  <path class="edge" d="M640,276 L560,276 L560,360"/>
  <text class="lbl" x="590" y="270">No</text>
  <!-- Q4 YES -> Full Spec -->
  <path class="edge" d="M760,302 L760,360"/>
  <text class="lbl" x="768" y="335">Yes</text>

  <!-- Tier: Vibe Basic -->
  <rect class="vibe" x="40" y="250" width="160" height="60" rx="8"/>
  <text class="tier-t" x="120" y="277" text-anchor="middle">Vibe Basic</text>
  <text class="tier-s" x="120" y="295" text-anchor="middle">1 task · 1 SOP · 1 user</text>

  <!-- Tier: Structured Vibe -->
  <rect class="svibe" x="220" y="250" width="170" height="60" rx="8"/>
  <text class="tier-t" x="305" y="277" text-anchor="middle">Structured Vibe</text>
  <text class="tier-s" x="305" y="295" text-anchor="middle">1 task · many SOPs</text>

  <!-- Tier: Spec-Lite -->
  <rect class="slite" x="480" y="360" width="160" height="60" rx="8"/>
  <text class="tier-t" x="560" y="387" text-anchor="middle">Spec-Lite</text>
  <text class="tier-s" x="560" y="405" text-anchor="middle">multi-step · low risk</text>

  <!-- Tier: Full Spec-Driven -->
  <rect class="sfull" x="680" y="360" width="180" height="60" rx="8"/>
  <text class="tier-t" x="770" y="387" text-anchor="middle">Full Spec-Driven</text>
  <text class="tier-s" x="770" y="405" text-anchor="middle">compliance · multi-stakeholder</text>

  <!-- Legend -->
  <text x="40" y="480" class="sub" font-weight="700">Approach</text>
  <rect class="vibe"  x="40"  y="492" width="16" height="16" rx="3"/>
  <text x="64"  y="505" class="sub">Vibe Coding — iterate to stability</text>
  <rect class="sfull" x="340" y="492" width="16" height="16" rx="3"/>
  <text x="364" y="505" class="sub">Spec-Driven — architecture-first, gated</text>

  <text x="40" y="545" class="sub" font-weight="700">Principle</text>
  <text x="40" y="565" class="sub">Design for the failure mode, not the happy path. Authority before action. Documents over instructions.</text>
</svg>
